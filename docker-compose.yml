services:
  postgres:
    image: postgres:16
    container_name: chronicles-postgres
    environment:
      POSTGRES_DB: chronicles_db
      POSTGRES_USER: chronicles_user
      POSTGRES_PASSWORD: chronicles_password
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  adminer:
    image: adminer:latest
    container_name: chronicles-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: chronicles-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: chronicles-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  minio_data:
  redis_data:
