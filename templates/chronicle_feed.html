<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chronicle.name }} — Лента</title>
    <link rel="stylesheet" href="/static/css/application_styles.css">
</head>
<body class="feed-page">
    <main class="mobile-page feed">
        <article class="feed-card">
            <video class="feed-media" autoplay muted loop playsinline poster="{{ default_image_url }}">
                {% if chronicle.video_url %}<source src="{{ chronicle.video_url }}" type="video/mp4">{% endif %}
                <source src="{{ default_video_url }}" type="video/mp4">
            </video>

            <div class="feed-overlay">
                <section class="feed-copy">
                    <h1>{{ chronicle.name }}</h1>
                    <p class="description-preview">{{ chronicle.short_description }}</p>
                    <details>
                        <summary>Больше / меньше</summary>
                        <p>{{ chronicle.short_description }}</p>
                    </details>
                </section>

                <aside class="feed-actions" aria-label="Информация о летописи">
                    <div class="topic-field">
                        <span>Год авторства</span>
                        <strong>{{ chronicle.authorship_year }}</strong>
                    </div>
                    <div class="topic-field">
                        <span>Год начала</span>
                        <strong>{{ chronicle.start_year }}</strong>
                    </div>
                    <div class="like-icon" aria-label="Количество отметок нравится">
                        <span aria-hidden="true">♥</span>
                        <strong>{{ likes_count }}</strong>
                    </div>
                    <a class="icon-action" href="/chronicles/feed?chronicle_id={{ chronicle.id }}&next=true">
                        <span aria-hidden="true">→</span>
                        <span>Следующий</span>
                    </a>
                </aside>
            </div>
        </article>
    </main>

    <nav class="bottom-nav" aria-label="Основная навигация">
        <a class="active" href="/chronicles/feed">Лента</a>
        <a href="/chronicles/add">Добавление</a>
        <a href="/chronicles/catalog">Плитка</a>
    </nav>
</body>
</html>
