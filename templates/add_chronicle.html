<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавить источник</title>

    <link rel="stylesheet" href="/static/css/application_styles.css">
</head>

<body class="add-page">

    <main class="add-container">

        <header class="page-header">
            <h1>Добавить источник</h1>
            <p>Заполните сведения о летописном источнике</p>
        </header>

        <form class="add-form">

            <!-- Сначала видео и изображение -->

            <div class="form-section">

                <h2>Медиа</h2>

                <div class="form-field">
                    <label for="видео">
                        Видео
                    </label>

                    <input
                        type="text"
                        id="видео"
                        name="видео"
                        placeholder="URL видео из MinIO"
                    >
                </div>

                <div class="form-field">
                    <label for="изображение">
                        Изображение
                    </label>

                    <input
                        type="text"
                        id="изображение"
                        name="изображение"
                        placeholder="URL изображения из MinIO"
                    >
                </div>

            </div>

            <!-- Основная информация -->

            <div class="form-section">

                <div class="form-field">
                    <label for="название">
                        Название источника
                    </label>

                    <input
                        type="text"
                        id="название"
                        name="название"
                        placeholder="Например, Повесть временных лет"
                    >
                </div>

                <div class="form-field">
                    <label for="тип_источника">
                        Тип источника
                    </label>

                    <input
                        type="text"
                        id="тип_источника"
                        name="тип_источника"
                        placeholder="Например, летописный свод"
                    >
                </div>

                <div class="form-field">
                    <label for="язык">
                        Язык
                    </label>

                    <input
                        type="text"
                        id="язык"
                        name="язык"
                        placeholder="Например, древнерусский"
                    >
                </div>

            </div>

            <!-- Даты -->

            <div class="form-section">

                <div class="form-field">
                    <label for="год_авторства">
                        Год авторства
                    </label>

                    <input
                        type="number"
                        id="год_авторства"
                        name="год_авторства"
                        placeholder="1116"
                    >
                </div>

                <div class="form-field">
                    <label for="год_начала">
                        Год начала
                    </label>

                    <input
                        type="number"
                        id="год_начала"
                        name="год_начала"
                        placeholder="852"
                    >
                </div>

            </div>

            <!-- Текст -->

            <div class="form-section">

                <div class="form-field">
                    <label for="заголовок">
                        Заголовок
                    </label>

                    <input
                        type="text"
                        id="заголовок"
                        name="заголовок"
                        placeholder="Заголовок публикации"
                    >
                </div>

                <div class="form-field">
                    <label for="описание">
                        Описание
                    </label>

                    <textarea
                        id="описание"
                        name="описание"
                        placeholder="Краткое описание источника"
                    ></textarea>
                </div>

            </div>

        </form>

    </main>

    <!-- Одинаковая нижняя панель -->

    <nav class="bottom-nav">

        <a href="/chronicle-feed/1">
            Лента
        </a>

        <a href="/add-chronicle">
            ＋ Добавить
        </a>

        <a href="/chronicle-catalog">
            Источники
        </a>

    </nav>

</body>
</html>
